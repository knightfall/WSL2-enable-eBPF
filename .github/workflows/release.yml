name: Build kernel release

on:
  push:
    tags: ['ebpf-v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison dwarves libssl-dev libelf-dev cpio qemu-utils rsync python3 xz-utils bc shellcheck
      - name: Validate repository
        run: scripts/validate-repository.sh
      - name: Compile and package pinned kernel
        run: scripts/build-release.sh
      - name: Attest every packaged release asset
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Include portable verification evidence
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/provenance.sigstore.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernel-release
          path: dist/*
          retention-days: 7
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kernel-release
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Prebuilt x86-64 WSL2 eBPF kernel and matching modules VHDX.

          Verify release assets and build attestations before installation. Build inputs and exact kernel source are included.
          This custom kernel applies globally to WSL2 distributions and requires manual updates.
          Compilation and configuration checks passed; WSL boot and workload validation are still required before publication.
          EOF
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "$RELEASE_TAG" --notes-file notes.md
